
<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F4F8FB;
        }

        header, footer {
            background-color: #AED6F1;
            color: #23415A;
            text-align: center;
            padding: 15px;
        }

        header h1 {
            margin: 15px;
        }

        .thankyou-box {
            background-color: white;
            width: 500px;
            max-width: 90%;
            margin: 70px auto;
            padding: 35px;
            text-align: center;
            border: 1px solid #D5E3ED;
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 12px #D6E4EE;
        }

        .sliding-text {
            overflow: hidden;
            white-space: nowrap;
            color: #2874A6;
            margin-bottom: 25px;
        }

        .sliding-text h1 {
            display: inline-block;
            margin: 0;
            animation: slide 5s linear infinite;
        }

        @keyframes slide {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(500px);
            }
        }

        .thankyou-box p {
            color: #555;
            line-height: 1.6;
        }

        .home-link {
            display: inline-block;
            background-color: #2874A6;
            color: white;
            padding: 12px 22px;
            margin-top: 20px;
            text-decoration: none;
            border-radius: 6px;
        }

        .home-link:hover {
            background-color: #1B4F72;
        }

        footer {
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Our Website</h1>
    </header>

    <hr>

    <div class="thankyou-box">

        <div class="sliding-text">
            <h1>Thank You!</h1>
        </div>

        <p>Your account has been created successfully.</p>

        <p>Welcome to our website!</p>

        <a href="index.html" class="home-link">
            Go to Login Page
        </a>

    </div>

    <footer>
        <hr>
        <p>© 2026 Our Website | All Rights Reserved</p>
    </footer>

</body>
</html>
