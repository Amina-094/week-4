
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
        }

        header, footer {
            background-color: #AED6F1;
            padding: 15px;
            text-align: center;
            color: #23415a;
        }

        .login-box {
            background-color: white;
            width: 300px;
            margin: 60px auto;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #23415a;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .login-box p {
            text-align: center;
        }

        a {
            color: #21618C;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to Our Website</h1>
</header>

<div class="login-box">
    <h2>Login</h2>

    <form action="thankyou.html" method="get">
        <label>Username:</label>
        <input type="text" name="username" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <input type="submit" value="Login">
    </form>

    <p>Don't have an account?</p>
    <p><a href="signup.html">Create an Account</a></p>
</div>

<footer>
    <p>© 2026 Our Website | All Rights Reserved</p>
</footer>

</body>
</html>
